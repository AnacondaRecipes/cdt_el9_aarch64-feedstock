package:
  name: java-1.8.0-openjdk-headless-el9-aarch64
  version: 1.8.0.452b9

source:
  - url: https://download.rockylinux.org/vault/rocky/9.5/AppStream/aarch64/os/Packages/j/java-1.8.0-openjdk-headless-1.8.0.452.b09-2.el9.aarch64.rpm
    sha256: 6d40b971f2b5d652f1df89f48268945b04e4647d6ca95e4c21d7a9589c9d0468
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and aarch64)]
  number: {{ build_number }}
  noarch: generic
  missing_dso_whitelist:
    - '*'

requirements:
  build:
    - sysroot_linux-aarch64 2.34.*
  host:
  run:
    - sysroot_linux-aarch64 2.34.*
    - ca-certificates
    - copy-jdk-configs-el9-aarch64 >=4.0 *_{{ build_number }}
    - freetype
    - javapackages-filesystem-el9-aarch64 ==6.0.0 *_{{ build_number }}
    - libgcc-ng
    - nss

test:
  commands:
    - test -f ${PREFIX}/aarch64-conda_el9-linux-gnu/sysroot/usr/lib/jvm/java-1.8.0-openjdk-1.8.0.452.b09-2.el9.aarch64/jre/lib/aarch64/libawt.so
    - test -f ${PREFIX}/aarch64-conda_el9-linux-gnu/sysroot/usr/lib/jvm/java-1.8.0-openjdk-1.8.0.452.b09-2.el9.aarch64/jre/lib/aarch64/libjava.so

# The nominal license is https://github.com/openjdk/jdk/blob/master/LICENSE
about:
  home: http://openjdk.java.net/
  license: ASL 1.1 and ASL 2.0 and BSD and BSD with advertising and GPL+ and GPLv2 and GPLv2 with exceptions and IJG and LGPLv2+ and MIT and MPLv2.0 and Public Domain and W3C and zlib
  license_family: Other
  license_file:
    - ASSEMBLY_EXCEPTION
    - LICENSE
    - THIRD_PARTY_README
  summary: (CDT) OpenJDK 8 Headless Runtime Environment
  description: |
    The OpenJDK 8 runtime environment without audio and video support.
  doc_url: http://openjdk.java.net/
  dev_url: http://openjdk.java.net/

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
